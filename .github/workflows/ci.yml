docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-check
      - frontend-check

    if: github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-backend:${{ github.sha }} \
            ./backend

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/automlops-backend:${{ github.sha }}

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "Backend image pushed to ECR."
          echo "Frontend image pushed to ECR."
          echo "Commit: ${{ github.sha }}"