name: AutoMLOps CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-check:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend imports
        env:
          PYTHONPATH: backend
          MLFLOW_ALLOW_FILE_STORE: "true"
          MLFLOW_TRACKING_URI: "file:./mlruns"
        run: |
          python -c "import app.main; print('Backend import OK')"

  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Validate Streamlit app
        run: |
          python -m py_compile frontend/app.py
          echo "Frontend validation OK"

  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-backend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-backend:latest \
            ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/automlops-backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/automlops-backend:latest

      - name: Build and push frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:latest \
            ./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/automlops-frontend:latest

      - name: Deployment summary
        run: |
          echo "Backend and frontend images successfully built and pushed to ECR."
          echo "Tags: ${{ github.sha }} and latest"