name: AutoMLOps CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  backend-check:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate backend imports
        env:
          PYTHONPATH: backend
        run: |
          python -c "import app.main; print('Backend import OK')"


  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Validate Streamlit app
        run: |
          python -m py_compile frontend/app.py
          echo "Frontend validation OK"


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t automlops-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t automlops-frontend:ci \
            ./frontend

      - name: Docker build completed
        run: |
          echo "Both Docker images built successfully."